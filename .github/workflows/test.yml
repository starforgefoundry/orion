name: Test

on:
  push:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: orion
          POSTGRES_PASSWORD: orion
          POSTGRES_DB: orion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://orion:orion@localhost:5432/orion_test
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - uses: jdx/mise-action@v3

      - name: Install dependencies
        run: pnpm i

      - name: Setup env variables
        run: cp .env.example .env

      - name: Run formatter
        run: pnpm prettier --check .

      - name: Run tsc
        run: pnpm check

      - name: Run tests
        run: pnpm test
